name: Bug report
description: Report a repeatable MA-Teacher problem
title: "[Bug] "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: "A responsible adult must review learner feedback before it is posted. Never attach learner work, names, school records, passwords, photos, health details, lesson answers, or a database. Use made-up examples."
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy and adult review
      options:
        - label: I removed names, school details, contact details, credentials, health information, learner work and lesson answers.
          required: true
        - label: If this report started with a learner, a responsible adult reviewed every word before posting it.
          required: true
  - type: input
    id: version
    attributes: {label: MA-Teacher version, placeholder: "0.1.0"}
    validations: {required: true}
  - type: dropdown
    id: role
    attributes:
      label: Which workflow?
      options: ["Teacher/operator", "Student/learner", "Installation/update", "Development/build"]
    validations: {required: true}
  - type: textarea
    id: steps
    attributes: {label: Steps to reproduce, description: Use a disposable or synthetic example.}
    validations: {required: true}
  - type: textarea
    id: expected
    attributes: {label: Expected result}
    validations: {required: true}
  - type: textarea
    id: actual
    attributes: {label: Actual result}
    validations: {required: true}
  - type: textarea
    id: environment
    attributes: {label: Windows and installation details, description: Do not include usernames, device names, school names, addresses, account details, keys or tokens.}
    validations: {required: true}

name: Feature request
description: Suggest a teaching, learning, accessibility, or workflow improvement
title: "[Feedback] "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: "A responsible adult must review learner feedback before it is posted. Do not post learner names, ages, classes, work, school records, account names, contact details, health information, lesson answers, credentials, photos, or other personal data. Use a made-up example."
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy and adult review
      options:
        - label: I removed names, ages, classes, school details, account names, contact details, credentials, health information, learner work and lesson answers.
          required: true
        - label: If this idea started with a learner, a responsible adult reviewed every word before posting it.
          required: true
  - type: dropdown
    id: audience
    attributes:
      label: Who needs this?
      options: ["Teacher/operator", "Student/learner", "Both", "Contributor/developer"]
    validations: {required: true}
  - type: textarea
    id: problem
    attributes: {label: What problem should MA-Teacher solve?}
    validations: {required: true}
  - type: textarea
    id: workflow
    attributes: {label: What would a good workflow look like?}
    validations: {required: true}

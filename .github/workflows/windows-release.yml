name: Windows release
on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Explicit Captain authorization to publish verified release to GitHub Releases'
        required: false
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ma-teacher-windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify-and-package:
    runs-on: windows-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up .NET 9
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 9.0.x
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Verify classroom web asset budget
        shell: pwsh
        run: node web/scripts/verify-web-assets.mjs
      - name: Verify source, runtime, install and uninstall
        shell: pwsh
        run: ./scripts/verify-public-release.ps1
      - name: Upload verified Windows installers
        uses: actions/upload-artifact@v6
        with:
          name: MA-Teacher-Windows
          path: |
            artifacts/MA-Teacher-Setup-*.exe
            artifacts/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

  publish-release:
    needs: verify-and-package
    if: github.event_name == 'workflow_dispatch' && inputs.publish_release == true && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out source for release metadata
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            ma-app.json
          sparse-checkout-cone-mode: false
      - name: Download verified Windows installers
        uses: actions/download-artifact@v6
        with:
          name: MA-Teacher-Windows
          path: artifacts
      - name: Publish verified release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content ma-app.json -Raw | ConvertFrom-Json).version
          if ($version -ne "0.1.0") { throw "Release version must remain exactly 0.1.0." }
          gh release upload 0.1.0 artifacts/MA-Teacher-Setup-$version.exe artifacts/MA-Teacher-Setup-latest.exe artifacts/SHA256SUMS.txt --repo $env:GITHUB_REPOSITORY --clobber
          gh release edit 0.1.0 --repo $env:GITHUB_REPOSITORY --title "MA-Teacher 0.1.0" --notes "Verified Windows build from main commit $env:GITHUB_SHA. The same installer supports teacher-led setup and supervised student use. Setup includes .NET and handles WebView2. Verify SHA256SUMS.txt before installing. This remains a prerelease while public feedback is collected."
